name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testar e compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk DCG-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DCG-TV-apk
          path: DCG-TV.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DCG TV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: DCG-TV.apk
          make_latest: true
